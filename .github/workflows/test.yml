name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Core has no third-party imports
        shell: bash
        run: |
          ! grep -nE "^\s*(import|from) (numpy|pandas|scipy|matplotlib)" \
            src/irradiance_calc/{units,fit,parse,table,cli}.py
      - name: Tests (GUI test runs under a virtual display on Linux)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y -qq xvfb > /dev/null
            xvfb-run -a python -m pytest -q -rs
          else
            python -m pytest -q -rs
          fi
      - name: Paper numbers reproduce from one command
        run: >
          irradiance-calc examples/argopower_example.csv --width-um 450 --height-um 450 --lines 488,640
          --settings "488: 3.15, 6.3, 12.6, 25.2; 640: 5, 40.6" --exposure-s 0.1 --slices 305
          --csv paper_check.csv --report paper_check.pdf
